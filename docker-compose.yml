# Gerolamo in Docker. `docker compose up -d` starts a preview relay that bootstraps from Mithril on its
# first start; see docs/DOCKER.md for the genesis-sync and block-producer variants.
#
# Chain data (block store, LMDB ledger, sockets, logs) lives in a host directory, so it survives the
# container being removed, rebuilt or upgraded: change the host side of the volume below to choose it.
# The container runs as your user (UID/GID), so the files are yours. Settings are flags in `command:` (no
# environment variables): the entrypoint's own (docker/entrypoint.sh), then node flags after "--" (docs/CONFIG.md).
#
# The desktop control center (Electrobun) runs on the host: Control Center → attach → port 3030.

services:
  gerolamo:
    build: .
    image: gerolamo:latest
    container_name: gerolamo-preview
    restart: unless-stopped
    stop_grace_period: 60s
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - --network
      - preview                         # preview | preprod | mainnet
      - --port
      - "3030"
      - --bootstrap
      - mithril                         # mithril (fast, from a verified snapshot) | genesis (build everything from block 0)
      - --role
      - relay                           # relay | data | producer (producer: see docs/DOCKER.md)
      - --max-rss-gb
      - "8"
      # - --                            # node flags follow, e.g.
      # - --n2n-ws-port
      # - "3004"
    volumes:
      - ./data/preview:/data
      # - ./pool-keys:/keys:ro          # producer only: cold.vkey, kes.skey, vrf.skey, node.cert
    ports:
      - "127.0.0.1:3030:3030"           # HTTP: /health /metrics /stats /ws/stats, mini-Blockfrost — for the desktop app
      - "3001:3001"                   # node-to-node: peers pull blocks here (relay / producer)
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
