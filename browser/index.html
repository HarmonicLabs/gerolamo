<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gerolamo Browser Node</title>
    <style>
      :root { color-scheme: light dark; --m: #777; --ok: #2a9d5c; --bad: #c0392b; }
      body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; max-width: 960px; margin-inline: auto; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      input { flex: 1; min-width: 260px; padding: 6px 8px; font: inherit; }
      button { padding: 6px 12px; font: inherit; cursor: pointer; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-bottom: 12px; }
      .card { border: 1px solid #8884; border-radius: 6px; padding: 8px 10px; }
      .card b { display: block; font-size: 11px; color: var(--m); text-transform: uppercase; letter-spacing: .04em; }
      .card span { font-variant-numeric: tabular-nums; font-size: 16px; }
      .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--m); }
      pre { background: #8881; padding: 8px; border-radius: 6px; max-height: 40vh; overflow: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
