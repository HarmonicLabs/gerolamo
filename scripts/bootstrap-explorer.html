<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerolamo — Mithril Bootstrap Explorer</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --harmonic-red: #e05252;
    --cardano-blue: #3cc8c8;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--harmonic-red);
  }
  header h1 span { color: var(--cardano-blue); }
  header .subtitle { color: var(--text-dim); font-size: 12px; }

  .controls {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls label { color: var(--text-dim); font-size: 12px; }
  .controls input, .controls select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    width: 100px;
  }
  .controls input:focus, .controls select:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 6px 16px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.stop { background: var(--harmonic-red); color: #fff; }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  .stats-bar {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; }
  .stat .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 18px; font-weight: 600; color: var(--cardano-blue); }
  .stat .value.streaming { color: var(--green); }
  .stat .value.error { color: var(--harmonic-red); }

  .progress-bar-container {
    padding: 0 24px;
    padding-top: 8px;
  }
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cardano-blue), var(--accent));
    transition: width 0.3s;
    width: 0%;
  }

  .main-content {
    display: grid;
    grid-template-columns: 1fr 400px;
    height: calc(100vh - 220px);
  }
  @media (max-width: 900px) {
    .main-content { grid-template-columns: 1fr; }
    .detail-panel { display: none; }
  }

  .table-container {
    overflow: auto;
    border-right: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface);
    padding: 8px 12px;
    text-align: left;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  tbody tr {
    cursor: pointer;
    transition: background 0.1s;
  }
  tbody tr:hover { background: rgba(88, 166, 255, 0.06); }
  tbody tr.selected { background: rgba(88, 166, 255, 0.12); }
  tbody td {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 300px;
  }
  .hash { color: var(--accent); }
  .idx { color: var(--yellow); text-align: right; }
  .size { color: var(--text-dim); text-align: right; }

  .detail-panel {
    padding: 16px;
    overflow: auto;
  }
  .detail-panel h3 {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .detail-field {
    margin-bottom: 12px;
  }
  .detail-field .field-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .detail-field .field-value {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    word-break: break-all;
    white-space: pre-wrap;
    max-height: 200px;
    overflow-y: auto;
    user-select: all;
  }
  .detail-field .field-value.hash { color: var(--accent); }

  .log {
    padding: 8px 24px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    max-height: 60px;
    overflow-y: auto;
  }
  .log .entry { padding: 1px 0; }
  .log .entry.error { color: var(--harmonic-red); }
  .log .entry.ok { color: var(--green); }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-dim);
    gap: 8px;
  }
  .empty-state .icon { font-size: 32px; opacity: 0.3; }
</style>
</head>
<body>

<header>
  <h1>Gerolamo <span>Bootstrap Explorer</span></h1>
  <div class="subtitle">Mithril LMDB Snapshot — UTxO Stream Viewer</div>
</header>

<div class="controls">
  <div>
    <label>Server</label>
    <input id="serverUrl" value="http://localhost:3040" style="width:200px">
  </div>
  <div>
    <label>Endpoint</label>
    <select id="endpoint">
      <option value="/stream/utxo">/stream/utxo</option>
      <option value="/stream/all">/stream/all</option>
    </select>
  </div>
  <div>
    <label>From</label>
    <input id="fromIdx" type="number" value="0" min="0">
  </div>
  <div>
    <label>Limit</label>
    <input id="limitVal" type="number" value="500" min="1">
  </div>
  <button id="btnStream" onclick="startStream()">Stream</button>
  <button id="btnStop" class="stop" onclick="stopStream()" disabled>Stop</button>
  <button class="secondary" onclick="clearData()">Clear</button>
  <button class="secondary" onclick="fetchInfo()">Info</button>
</div>

<div class="stats-bar">
  <div class="stat">
    <span class="label">Status</span>
    <span class="value" id="statStatus">Idle</span>
  </div>
  <div class="stat">
    <span class="label">Entries</span>
    <span class="value" id="statEntries">0</span>
  </div>
  <div class="stat">
    <span class="label">Bytes Received</span>
    <span class="value" id="statBytes">0</span>
  </div>
  <div class="stat">
    <span class="label">Rate</span>
    <span class="value" id="statRate">—</span>
  </div>
  <div class="stat">
    <span class="label">Elapsed</span>
    <span class="value" id="statTime">—</span>
  </div>
</div>

<div class="progress-bar-container">
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
</div>

<div class="main-content">
  <div class="table-container" id="tableContainer">
    <table>
      <thead>
        <tr>
          <th style="width:50px">#</th>
          <th>Tx Hash</th>
          <th style="width:50px">Idx</th>
          <th style="width:80px">Value Size</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState">
      <div class="icon">&#9651;</div>
      <div>Click "Stream" to fetch UTxO entries</div>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <h3>Entry Detail</h3>
    <div id="detailContent">
      <div class="empty-state" style="height:200px">
        <div>Select a row to inspect</div>
      </div>
    </div>
  </div>
</div>

<div class="log" id="logPanel"></div>

<script>
  const state = {
    entries: [],
    reader: null,
    abortController: null,
    startTime: null,
    totalBytes: 0,
    selected: null,
    totalExpected: null,
  };

  const $ = id => document.getElementById(id);

  function log(msg, cls = '') {
    const el = $('logPanel');
    const d = document.createElement('div');
    d.className = 'entry ' + cls;
    d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  }

  function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }

  function updateStats() {
    $('statEntries').textContent = state.entries.length.toLocaleString();
    $('statBytes').textContent = formatBytes(state.totalBytes);
    if (state.startTime) {
      const elapsed = (Date.now() - state.startTime) / 1000;
      $('statTime').textContent = elapsed.toFixed(1) + 's';
      if (elapsed > 0) {
        $('statRate').textContent = Math.round(state.entries.length / elapsed).toLocaleString() + '/s';
      }
    }
    if (state.totalExpected && state.totalExpected > 0) {
      const pct = Math.min(100, (state.entries.length / state.totalExpected) * 100);
      $('progressFill').style.width = pct + '%';
    }
  }

  function addRow(entry, index) {
    const tbody = $('tableBody');
    const tr = document.createElement('tr');
    tr.dataset.index = index;
    tr.onclick = () => selectRow(index);

    if (entry.txHash) {
      tr.innerHTML = `
        <td>${index}</td>
        <td class="hash" title="${entry.txHash}">${entry.txHash.slice(0, 16)}...${entry.txHash.slice(-8)}</td>
        <td class="idx">${entry.outputIndex}</td>
        <td class="size">${entry.valueCbor ? (entry.valueCbor.length / 2) + 'B' : '—'}</td>
      `;
    } else if (entry.db) {
      tr.innerHTML = `
        <td>${index}</td>
        <td title="${entry.key}">[${entry.db}] ${entry.key.slice(0, 24)}...</td>
        <td class="idx">—</td>
        <td class="size">${entry.value ? (entry.value.length / 2) + 'B' : '—'}</td>
      `;
    }
    tbody.appendChild(tr);
  }

  function selectRow(index) {
    const entry = state.entries[index];
    if (!entry) return;
    state.selected = index;

    document.querySelectorAll('tbody tr.selected').forEach(r => r.classList.remove('selected'));
    const row = document.querySelector(`tr[data-index="${index}"]`);
    if (row) row.classList.add('selected');

    let html = '';
    if (entry.txHash) {
      html += `
        <div class="detail-field">
          <div class="field-label">Transaction Hash</div>
          <div class="field-value hash">${entry.txHash}</div>
        </div>
        <div class="detail-field">
          <div class="field-label">Output Index</div>
          <div class="field-value">${entry.outputIndex}</div>
        </div>
        <div class="detail-field">
          <div class="field-label">Value CBOR (${entry.valueCbor.length / 2} bytes)</div>
          <div class="field-value">${entry.valueCbor}</div>
        </div>
        <div class="detail-field">
          <div class="field-label">First Byte</div>
          <div class="field-value">${'0x' + entry.valueCbor.slice(0, 2)} — ${describeFirstByte(entry.valueCbor)}</div>
        </div>
      `;
    } else if (entry.db) {
      html += `
        <div class="detail-field">
          <div class="field-label">Database</div>
          <div class="field-value">${entry.db}</div>
        </div>
        <div class="detail-field">
          <div class="field-label">Key</div>
          <div class="field-value hash">${entry.key}</div>
        </div>
        <div class="detail-field">
          <div class="field-label">Value (${entry.value.length / 2} bytes)</div>
          <div class="field-value">${entry.value}</div>
        </div>
      `;
    }
    $('detailContent').innerHTML = html;
  }

  function describeFirstByte(hex) {
    const b = parseInt(hex.slice(0, 2), 16);
    if (b <= 0x17) return `CBOR uint (${b})`;
    if (b === 0x18) return 'CBOR uint (1-byte follows)';
    if (b === 0x19) return 'CBOR uint (2-byte follows)';
    if (b >= 0x20 && b <= 0x3b) return 'CBOR negative int';
    if (b >= 0x40 && b <= 0x5b) return 'CBOR byte string';
    if (b >= 0x60 && b <= 0x7b) return 'CBOR text string';
    if (b >= 0x80 && b <= 0x9b) return 'CBOR array';
    if (b >= 0xa0 && b <= 0xbb) return 'CBOR map';
    if (b >= 0xc0 && b <= 0xdb) return 'CBOR tag';
    if (b === 0xf6) return 'CBOR null';
    return `Raw byte 0x${b.toString(16)}`;
  }

  async function fetchInfo() {
    const base = $('serverUrl').value;
    try {
      const res = await fetch(base + '/info');
      const info = await res.json();
      state.totalExpected = info.totalEntries;
      log(`Snapshot info: ${info.totalEntries.toLocaleString()} entries across [${info.databases.join(', ')}]`, 'ok');
      log(`LMDB path: ${info.dbDir}`);
    } catch (e) {
      log('Failed to fetch /info: ' + e.message, 'error');
    }
  }

  async function startStream() {
    const base = $('serverUrl').value;
    const endpoint = $('endpoint').value;
    const from = $('fromIdx').value;
    const limit = $('limitVal').value;

    const url = `${base}${endpoint}?from=${from}&limit=${limit}`;
    log(`Connecting to ${url}...`);

    $('btnStream').disabled = true;
    $('btnStop').disabled = false;
    $('statStatus').textContent = 'Streaming';
    $('statStatus').className = 'value streaming';
    $('emptyState').style.display = 'none';
    state.startTime = Date.now();
    state.totalBytes = 0;
    state.totalExpected = parseInt(limit);

    try {
      state.abortController = new AbortController();
      const res = await fetch(url, { signal: state.abortController.signal });
      const reader = res.body.getReader();
      state.reader = reader;
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        state.totalBytes += value.byteLength;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const obj = JSON.parse(line);
            if (obj._progress) {
              log(`Progress: ${obj.db} — ${obj.count.toLocaleString()} entries`);
              continue;
            }
            if (obj._done) {
              log(`Done. Total streamed: ${obj.totalStreamed.toLocaleString()}`, 'ok');
              continue;
            }
            if (obj._error) {
              log(`Error: ${obj._error}`, 'error');
              continue;
            }
            const idx = state.entries.length;
            state.entries.push(obj);
            addRow(obj, idx);
          } catch (e) {
            log('Parse error: ' + e.message, 'error');
          }
        }
        updateStats();
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        log('Stream error: ' + e.message, 'error');
        $('statStatus').textContent = 'Error';
        $('statStatus').className = 'value error';
      }
    } finally {
      $('btnStream').disabled = false;
      $('btnStop').disabled = true;
      if ($('statStatus').textContent === 'Streaming') {
        $('statStatus').textContent = 'Complete';
        $('statStatus').className = 'value streaming';
      }
      updateStats();
    }
  }

  function stopStream() {
    if (state.abortController) {
      state.abortController.abort();
      state.abortController = null;
    }
    $('statStatus').textContent = 'Stopped';
    $('statStatus').className = 'value error';
    log('Stream stopped by user');
  }

  function clearData() {
    state.entries = [];
    state.selected = null;
    state.totalBytes = 0;
    state.startTime = null;
    $('tableBody').innerHTML = '';
    $('detailContent').innerHTML = '<div class="empty-state" style="height:200px"><div>Select a row to inspect</div></div>';
    $('emptyState').style.display = '';
    $('statEntries').textContent = '0';
    $('statBytes').textContent = '0';
    $('statRate').textContent = '—';
    $('statTime').textContent = '—';
    $('statStatus').textContent = 'Idle';
    $('statStatus').className = 'value';
    $('progressFill').style.width = '0%';
    log('Cleared');
  }
</script>
</body>
</html>
